name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Expo base URL for Pages only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.experiments = { ...config.expo.experiments, baseUrl: '/RooMind_GIT' };
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build web app
        run: npm run build:web

      - name: Verify exported JavaScript paths
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!html.includes('/RooMind_GIT/_expo/') || /src=["']\/_expo\//.test(html)) {
            throw new Error('Exported JavaScript does not use the GitHub Pages base URL');
          }
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
